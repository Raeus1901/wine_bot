<style>
/* styles.css */

/* Basic reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: sans-serif;
  background: #f2f2f2;
}

/* Container */
#app-container {
  width: 600px;
  max-width: 90%;
  margin: 30px auto;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 0 10px #ccc;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

#conversation {
  border: 1px solid #ccc;
  border-radius: 5px;
  height: 300px;
  overflow-y: auto;
  padding: 10px;
  background: #fafafa;
  margin-bottom: 10px;
}

#conversation p {
  margin-bottom: 8px;
  line-height: 1.5; /* Added for better readability */
}

#conversation .ai {
  color: #654ff0;
}

#conversation .you {
  color: #2fa92f;
}

#conversation .system {
  font-style: italic;
  color: #f44;
}

#input-area {
  display: flex;
  gap: 5px;
}

#user-input {
  flex: 1;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

/* General Button Styles */
button {
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}

/* Send and Reset Button Styles */
#submit-button,
#reset-button {
  background: #ffffff; /* White background */
  color: #333333;       /* Dark text */
  border: 1px solid #ccc; /* Light gray border for definition */
  transition: background 0.3s, color 0.3s;
}

#submit-button:hover,
#reset-button:hover {
  background: #f0f0f0; /* Slightly darker on hover */
  color: #000000;       /* Darker text on hover */
}

/* Option bubbles appended to conversation */
.option-button {
  display: inline-block;
  margin: 0 5px 5px 0;
  padding: 6px 8px;
  border-radius: 4px;
  background: #eee;
  cursor: pointer;
  border: 1px solid #ccc;
  color: #000; /* Ensures black text on option buttons */
}

.option-button:hover {
  background: #ddd;
}

/* Styling for Recommendations */
.ai ol {
  margin-left: 20px;
}

.ai li {
  margin-bottom: 15px; /* Adds spacing between recommendations */
  line-height: 1.5;
}

/* Additional Styling for Nested Lists */
.ai ul {
  margin-left: 40px;
}

.ai ul ul {
  margin-left: 60px;
}
</style>
